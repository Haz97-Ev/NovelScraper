name: "windows-build"

# Builds a Windows installer for this fork as a private run artifact (no public release)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - browse-and-quick-download

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The fork config turns off signed updater artifacts (they need the upstream signing key)
      # and points the in-app updater at this fork instead of the original repo
      - name: build app
        run: pnpm tauri build --config src-tauri/tauri.fork.conf.json

      - name: upload installers
        uses: actions/upload-artifact@v4
        with:
          name: NovelScraper-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
